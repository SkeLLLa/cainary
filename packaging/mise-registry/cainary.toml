# Staged copy of a mise registry entry for cainary.
#
# Not consumed by mise from here. Once cainary meets mise's popularity bar
# (https://mise.jdx.dev/contributing.html#adding-tools), copy this file to
# registry/cainary.toml in a jdx/mise PR; `mise use cainary` then works without the
# `packslip:` prefix (docs/distribution.md).
#
# The packslip manifest lists the macOS universal tarball and the Linux x86_64 and aarch64
# tarballs. The registry exposes the `cainary` CLI; the Linux archives also carry the tray
# binary, which needs the host's Qt 6 (docs/linux.md).

version_order = "semver"
description = "Shows what your AI tools and the device monitoring around them track and send"
backends = [
  { full = "packslip:github.com/SkeLLLa/cainary", min_version = "0.1.0" },
]
bins = ["cainary"]
os = ["linux", "macos"]
test = { cmd = "cainary --version", expected = "cainary {{version}}" }
