[workspace]
resolver = "3"
members = ["crates/cainary-core", "crates/cainary-cli", "crates/cainary-net", "crates/cainary-sig", "crates/cainary-bind-helper", "crates/cainary-hosts-helper"]
exclude = ["linux"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/SkeLLLa/cainary"
homepage = "https://github.com/SkeLLLa/cainary"
keywords = ["telemetry", "privacy", "ai", "audit", "macos"]
categories = ["command-line-utilities", "development-tools"]
# Only crates.io; cargo publish refuses any other registry.
publish = ["crates-io"]

# The only dependencies the product may have (architecture.md §2). Adding one is a reviewed
# change; tests/guards.rs checks Cargo.lock against an allowlist.
[workspace.dependencies]
# Exact: the two crates are released together at one version (scripts/set-version.sh).
cainary-core = { path = "crates/cainary-core", version = "=1.0.0" }
cainary-sig = { path = "crates/cainary-sig" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
# Tilde: cainary-core uses plist::stream, which may break between minor versions.
plist = { version = "~1.10.3", features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
libc = { version = "0.2", default-features = false }
# Only cainary-net, always on (gzip OTLP request bodies, pure Rust via miniz_oxide; no zlib/C).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Only cainary-net, only under its non-default `tls` feature (the endpoint takeover):
# rustls with the ring provider (never aws-lc-rs) and rcgen for the ephemeral CA and leaves.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Only cainary-net under `tls`: validity dates for the CA and leaves (rcgen takes OffsetDateTime).
# Already in the lock through plist.
time = { version = "0.3", default-features = false, features = ["std"] }
# Only cainary-net: user red-flag patterns; linear-time matching, so hostile input can't ReDoS.
regex = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind" # main catches panics and exits 3
strip = true
