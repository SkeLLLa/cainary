name: CI

on:
  push:
    branches: [master]
  pull_request:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI runs plain make. On the runner jobs, jdx/mise-action installs the tools that mise.toml pins
# (rust, shellcheck, jactionlint) and MISE_ENV=ci layers mise.ci.toml over it: plain cargo
# instead of mbx, Xcode's swiftc. The container jobs bootstrap rustup in packaging/ci/linux-ci.sh.
jobs:
  conventional-commits:
    name: Conventional commit messages
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify Conventional Commit messages
        uses: opensource-nepal/commitlint@9c112b70de7b0e51f81d12a5268a451db5419794 # v2.0.0

  # Every action is pinned to a commit SHA (Dependabot bumps the SHA and its version comment).
  # An unpinned action fails here and in the release pin-gate. If
  # `.github/actions/**/action.y?ml` appears, the gate and this check must cover it too.
  pin-check:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the pin checker
        run: scripts/test-action-pins.sh
      - name: Check action pins
        run: scripts/check-action-pins.sh .github/workflows/*.yml

  # Static analysis of the workflows (injection, excessive permissions, unpinned actions...).
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  actions-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_ENV: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise 2026.10.14, pinned by checksum. mise.lock pins the tools (the action adds --locked).
      # No mise cache: the tools are small and rustup's toolchain is outside it.
      - name: Install jactionlint, shellcheck (versions from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.14
          sha256: 50be7185bcf75929f01cc5630276bcb43ca367f7c5b176e2580903d28c611dc4
          install_args: jactionlint shellcheck
          cache: false
      - name: Show tools
        run: |
          jactionlint --version
          shellcheck --version
      - name: make lint-actions
        run: make lint-actions

  macos:
    name: Lint, test, ui-test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MISE_ENV: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise 2026.10.14, pinned by checksum. mise.lock pins the tools (the action adds --locked).
      # No mise cache: the tools are small and rustup's toolchain is outside it.
      - name: Install rust, shellcheck (versions from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.14
          sha256: 005b32b9c22ca9cb63ff9d35c74b3abe69c433e9ca655fea288ba3dcbe7e4918
          install_args: rust shellcheck
          cache: false
      - name: Show toolchain
        run: |
          cargo --version
          swiftc --version
          swift format --version
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: make check (fmt, clippy, swift format, shellcheck, cargo test, ui-test)
        run: make check
      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          retention-days: 7
          if-no-files-found: ignore
          path: target/ui-snapshots/

  linux:
    name: Rust core and CLI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_ENV: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise 2026.10.14, pinned by checksum. mise.lock pins the tools (the action adds --locked).
      # No mise cache: the tools are small and rustup's toolchain is outside it.
      - name: Install rust (versions from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.14
          sha256: 50be7185bcf75929f01cc5630276bcb43ca367f7c5b176e2580903d28c611dc4
          install_args: rust
          cache: false
      - name: Show toolchain
        run: cargo --version
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: make check-rust (fmt, clippy, cargo test)
        run: make check-rust
      - name: make publish-check (cargo publish --dry-run for both crates)
        run: make publish-check

  bundle:
    name: Bundle smoke test (universal)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      MISE_ENV: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise 2026.10.14, pinned by checksum. mise.lock pins the tools (the action adds --locked).
      # No mise cache: the tools are small and rustup's toolchain is outside it.
      - name: Install rust (versions from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.14
          sha256: 005b32b9c22ca9cb63ff9d35c74b3abe69c433e9ca655fea288ba3dcbe7e4918
          install_args: rust
          cache: false
      - name: Build universal app bundle (ad-hoc signed)
        run: make bundle RELEASE=1
      - name: Verify bundle
        run: |
          set -euo pipefail
          APP="dist/cAInary.app"
          for BIN in "${APP}/Contents/MacOS/cAInary" "${APP}/Contents/Helpers/cainary"; do
            ARCHS_FOUND="$(lipo -archs "${BIN}")"
            echo "${BIN}: ${ARCHS_FOUND}"
            for arch in arm64 x86_64; do
              case " ${ARCHS_FOUND} " in
                *" ${arch} "*) ;;
                *) echo "${BIN}: missing architecture ${arch}" >&2; exit 1 ;;
              esac
            done
          done
          codesign --verify --deep --strict --verbose=2 "${APP}"
          "${APP}/Contents/Helpers/cainary" --version
      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cainary-macos-universal
          retention-days: 7
          if-no-files-found: error
          path: dist/cAInary-*-macos.zip

  # The Qt tray app, in containers of the distros it ships for (docs/linux.md). The CLI is the
  # root workspace, checked by `linux` above; the musl build of it is checked by linux-package.
  linux-app:
    name: Tray app (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary: the .deb and tarball are built here (Qt 6.8, LayerShellQt 6.3).
          - name: debian-trixie
            image: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
            target: linux-check
          # The newest Qt and LayerShellQt.
          - name: fedora-44
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            target: linux-check
          - name: archlinux
            image: archlinux:latest@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
            target: linux-build
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      # git first, so that checkout clones (SOURCE_DATE_EPOCH, set-version) instead of
      # downloading a tarball.
      - name: Install git
        run: |
          if command -v apt-get > /dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
          elif command -v dnf > /dev/null; then dnf install -y -q git-core
          else pacman -Syu --noconfirm --needed git; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and the tray's build dependencies
        run: packaging/ci/linux-ci.sh deps build
      # CARGO_HOME (/usr/local/cargo) is read from the job env. rustc is on PATH from linux-ci.sh.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: linux -> target
          shared-key: linux-app-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
      - name: make linux-ui-test
        if: matrix.name == 'debian-trixie'
        run: make linux-ui-test
      - name: Upload UI snapshots
        if: always() && matrix.name == 'debian-trixie'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots-linux
          retention-days: 7
          if-no-files-found: ignore
          path: target/ui-snapshots/linux/

  # Unsigned packages for this commit; release.yml builds the published ones the same way.
  linux-package:
    name: Package (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-trixie
            image: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
            formats: tar,deb
          # Fedora 44 only: the rpm is built and installed there.
          - name: fedora-44
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            formats: rpm
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install git
        run: |
          if command -v apt-get > /dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
          else dnf install -y -q git-core; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust, build dependencies, cargo-deb and cargo-generate-rpm
        run: packaging/ci/linux-ci.sh deps package
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            linux -> target
          shared-key: linux-package-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: make linux
        run: make linux LINUX_FORMATS=${{ matrix.formats }}
      - name: Inspect the artifacts
        run: |
          set -eu
          packaging/ci/linux-ci.sh inspect dist "$(packaging/ci/linux-ci.sh version)" "$(uname -m)"
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Install the packages on clean systems, as users would, and run both binaries. The QML
  # modules are invisible to shlibdeps and auto-req; the self-test loads every component.
  linux-install-smoke:
    name: Install smoke test (${{ matrix.name }})
    needs: linux-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-trixie
            image: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
            kind: deb
            package: linux-package-debian-trixie
          - name: ubuntu-26.04
            image: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
            kind: deb
            package: linux-package-debian-trixie
          - name: fedora-44
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            kind: rpm
            package: linux-package-fedora-44
          # The tarball with the AUR package's depends, through install-user.sh.
          - name: archlinux
            image: archlinux:latest@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
            kind: tar
            package: linux-package-debian-trixie
    steps:
      # No git: the smoke test needs only the scripts, PKGBUILD and Cargo.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.package }}
          path: dist
      - name: Install and run
        run: packaging/ci/linux-ci.sh smoke ${{ matrix.kind }} dist
