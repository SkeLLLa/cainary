# Release fails closed until every action is pinned to a commit SHA (pin-gate).
name: Release

on:
  push:
    branches:
      - master

# One release at a time: a push during a release waits for it instead of cancelling it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

jobs:
  pin-gate:
    name: Action pin gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every action in every workflow to be pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetch every workflow, the checker and its image list, as committed at the
          # triggering SHA; no checkout, no third-party action. Fails closed: no files, no
          # listing or any failed fetch fails the gate, and so does an unpinned action in ci.yml.
          dir="${RUNNER_TEMP}/workflows"
          mkdir -p "${dir}" "${RUNNER_TEMP}/scripts" "${RUNNER_TEMP}/packaging/ci"
          fetch() {
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${GITHUB_SHA}"
          }
          names="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=${GITHUB_SHA}" \
              --jq '.[] | select(.type == "file") | select(.name | test("\\.ya?ml$")) | .name'
          )"
          if [ -z "${names}" ]; then
            echo "::error::no workflow files found at ${GITHUB_SHA}"
            exit 1
          fi
          files=()
          while IFS= read -r name; do
            case "${name}" in */* | "") echo "::error::unexpected workflow name"; exit 1 ;; esac
            fetch ".github/workflows/${name}" > "${dir}/${name}"
            files+=("${dir}/${name}")
          done <<< "${names}"
          fetch scripts/check-action-pins.sh > "${RUNNER_TEMP}/scripts/check-action-pins.sh"
          fetch packaging/ci/images.env > "${RUNNER_TEMP}/packaging/ci/images.env"
          sh "${RUNNER_TEMP}/scripts/check-action-pins.sh" "${files[@]}"

  quality:
    name: Quality gate
    needs: pin-gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      MISE_ENV: ci
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise 2026.10.14, pinned by checksum. mise.lock pins the tools (the action adds --locked).
      # Release workflows do not use a cache; mise exports the ci environment for later steps.
      - name: Install Rust and shellcheck (versions from mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_ENV: ci
        with:
          version: 2026.10.14
          sha256: 005b32b9c22ca9cb63ff9d35c74b3abe69c433e9ca655fea288ba3dcbe7e4918
          install_args: rust shellcheck
          cache: false
          env: true

      - name: Run checks
        run: make check

  # The shared Rust core and CLI on Linux, as ci.yml's linux job; the macOS gate only covers macOS.
  quality-rust-linux:
    name: Quality gate (Rust core and CLI, Linux)
    needs: pin-gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENV: ci
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise 2026.10.14, pinned by checksum. mise.lock pins the tools (the action adds --locked).
      # Release workflows do not use a cache; mise exports the ci environment for later steps.
      - name: Install Rust (version from mise.toml)
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_ENV: ci
        with:
          version: 2026.10.14
          sha256: 50be7185bcf75929f01cc5630276bcb43ca367f7c5b176e2580903d28c611dc4
          install_args: rust
          cache: false
          env: true

      - name: Run checks
        run: make check-rust

  # The Linux tray app, as ci.yml's linux-app job on debian:trixie.
  quality-linux:
    name: Quality gate (Linux tray)
    needs: pin-gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    permissions:
      contents: read
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust and the tray's build dependencies
        run: packaging/ci/linux-ci.sh deps build

      - name: Run checks
        run: make linux-check

  # Decides what to release and publishes nothing: the version, the commit every build starts
  # from, and a hash of the version-bumped files. The bump is committed, tagged and released
  # only by `publish`, once every build has passed. Same flow as the sibling Rust repos'
  # release-plz setup, with git-cliff: no release PR, so the default GITHUB_TOKEN is enough.
  # It and the builds run alongside the quality gates; checksums and publish wait for them.
  prepare:
    name: Prepare release
    needs: pin-gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.prepare.outputs.released }}
      resumed: ${{ steps.prepare.outputs.resumed }}
      version: ${{ steps.prepare.outputs.version }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      release_date: ${{ steps.prepare.outputs.release_date }}
      version_hash: ${{ steps.prepare.outputs.version_hash }}
      git_sha: ${{ steps.prepare.outputs.git_sha }}
      source_date_epoch: ${{ steps.prepare.outputs.source_date_epoch }}
      build_date: ${{ steps.prepare.outputs.build_date }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that triggered the run, also on a rerun, even if master has moved on.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: git-cliff@2.14.2

      - name: Compute the version and the release tree
        id: prepare
        run: |
          set -euo pipefail
          # cliff.toml: the first release is v0.1.0; afterwards feat bumps minor, others patch.
          # A Cargo.toml [workspace.package] version that names an untagged version wins, so a
          # release can be set by hand (for example 1.0.0) by committing that version.
          TAG_NAME="$(git cliff --bumped-version)"
          PINNED="v$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml)"
          if ! git rev-parse -q --verify "refs/tags/${PINNED}" > /dev/null; then
            TAG_NAME="${PINNED}"
          fi
          VERSION="${TAG_NAME#v}"
          BASE_SHA="$(git rev-parse HEAD)"
          # The About window's commit and build date, as the Makefile derives them. Computed here
          # because the Linux builds run in containers, where git refuses the runner-owned checkout.
          GIT_SHA="$(git rev-parse --short HEAD)"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          BUILD_DATE="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          RESUMED=false
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null; then
            # A tag on the bump commit made from this very commit means an earlier run of this
            # workflow got as far as tagging; build again and let `publish` finish the release.
            if [ "$(git rev-parse -q --verify "refs/tags/${TAG_NAME}^{commit}^" || true)" = "${BASE_SHA}" ]; then
              echo "${TAG_NAME} was tagged from ${BASE_SHA} by an earlier run: resuming"
              RESUMED=true
            else
              echo "Nothing to release: ${TAG_NAME} already exists"
              echo "released=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          mkdir -p prepared
          git cliff --unreleased --tag "${TAG_NAME}" --strip all > prepared/NOTES.md
          git cliff --tag "${TAG_NAME}" --output prepared/CHANGELOG.md
          # The date is fixed here so every job produces the same AppStream <release>. This
          # run's checkout is not pushed anywhere; the hash is what the builds must reproduce.
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          HASH="$(SET_VERSION_DATE="${RELEASE_DATE}" scripts/release-tree.sh "${VERSION}" | tail -n 1)"
          test "${#HASH}" -eq 64
          {
            echo "released=true"
            echo "resumed=${RESUMED}"
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "base_sha=${BASE_SHA}"
            echo "release_date=${RELEASE_DATE}"
            echo "version_hash=${HASH}"
            echo "git_sha=${GIT_SHA}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            echo "build_date=${BUILD_DATE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Keep the notes and changelog
        if: ${{ steps.prepare.outputs.released == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-notes
          retention-days: 1
          if-no-files-found: error
          path: |
            prepared/NOTES.md
            prepared/CHANGELOG.md

  build:
    name: Build macOS assets
    needs: prepare
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    # Checksums and provenance come from the checksums job, the release from publish.
    permissions:
      contents: read
    # The signing key lives only in this environment's secrets. Its deployment-branch rule
    # (master only) keeps it out of reach of workflows run from any other branch, tag or PR;
    # see docs/distribution.md#signing.
    environment: macos-signing
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Read by the Makefile and packaging/linux.sh instead of asking git.
      CAINARY_GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
      CAINARY_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
      # A presence flag only (a boolean, never a secret value); each secret itself is set in the
      # env of the one step that needs it.
      SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      # The bump is only committed by `publish`; every build applies the same one locally.
      - name: Apply the release version
        env:
          SET_VERSION_DATE: ${{ needs.prepare.outputs.release_date }}
          EXPECTED_HASH: ${{ needs.prepare.outputs.version_hash }}
        run: scripts/release-tree.sh "${VERSION}"

      # The committed pin is the signing identity. Once it exists every release must be signed
      # with it: an ad-hoc or differently signed release would reset every user's grants.
      - name: Resolve the signing identity
        run: |
          set -euo pipefail
          PIN_FILE="packaging/signing/release.sha1"
          if [ -f "${PIN_FILE}" ]; then
            PIN="$(tr -d '[:space:]' < "${PIN_FILE}" | tr '[:lower:]' '[:upper:]')"
            if ! printf '%s' "${PIN}" | grep -Eq '^[0-9A-F]{40}$'; then
              echo "::error::${PIN_FILE} must hold one 40-digit SHA-1"
              exit 1
            fi
            if [ "${SIGNING_CONFIGURED}" != "true" ]; then
              echo "::error::${PIN_FILE} is committed but the macos-signing environment has no MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD"
              exit 1
            fi
            echo "CODESIGN_IDENTITY=${PIN}" >> "${GITHUB_ENV}"
          elif [ "${SIGNING_CONFIGURED}" = "true" ]; then
            echo "::error::signing secrets are set but ${PIN_FILE} is missing; commit the certificate's SHA-1"
            exit 1
          fi

      - name: Install Rust (version from mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default "${v}"

      - name: Show toolchain
        run: |
          cargo --version
          swiftc --version

      # Compiled before the key is imported, so no dependency build script or proc macro runs
      # while it is in a keychain. RELEASE=1 builds both Apple targets and lipos them.
      - name: Build universal binaries
        run: make app core-universal RELEASE=1

      - name: Import the signing certificate
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 900 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          # -x: the private key can't be exported again; -T: only codesign may use it.
          security import "${RUNNER_TEMP}/certificate.p12" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -x -t agg -f pkcs12 -k "${KEYCHAIN}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${RUNNER_TEMP}/certificate.p12"
          # The secret must hold the pinned certificate, not just any identity.
          if ! security find-identity -p codesigning "${KEYCHAIN}" | grep -q " ${CODESIGN_IDENTITY} "; then
            echo "::error::MACOS_CERTIFICATE_P12 does not hold the identity pinned in packaging/signing/release.sha1"
            exit 1
          fi

      # Assembles and signs only. CODESIGN_IDENTITY is the pin when signing (set above), unset
      # otherwise: bundle.sh then signs ad hoc. With a pin it also verifies the requirement.
      - name: Bundle and sign the app
        env:
          CORE: target/universal/cainary
        run: packaging/bundle.sh

      - name: Remove signing keychain and certificate
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        run: |
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security delete-keychain "${RUNNER_TEMP}/build.keychain-db" || true

      - name: Signing status
        run: |
          set -euo pipefail
          mkdir -p release-assets
          NOTES="release-assets/NOTES.md"
          APP="/Applications/cAInary.app"
          if [ -z "${CODESIGN_IDENTITY:-}" ]; then
            echo "::warning::Release is ad-hoc signed (packaging/signing/release.sha1 is not committed)"
            {
              echo "> **Note:** this build is ad-hoc signed and not notarized by Apple, and macOS"
              echo "> asks for its permissions again after each update."
              echo "> After installing, run \`xattr -dr com.apple.quarantine ${APP}\`."
            } > "${NOTES}"
          else
            {
              echo "> **Note:** this build is signed with cAInary's own certificate, not notarized by Apple."
              echo "> After installing, run \`xattr -dr com.apple.quarantine ${APP}\`."
              echo "> To check it, \`codesign -dr - ${APP}\` must print"
              echo "> \`certificate leaf = H\"$(printf %s "${CODESIGN_IDENTITY}" | tr A-F a-f)\"\`."
            } > "${NOTES}"
          fi

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ZIP="cainary-${VERSION}-macos-universal.zip"
          TGZ="cainary-${VERSION}-macos-universal.tar.gz"
          cp "dist/cAInary-${VERSION}-macos.zip" "release-assets/${ZIP}"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C dist -czf "release-assets/${TGZ}" cAInary.app

      # For the checksums job, which hashes and attests every platform's assets together.
      - name: Keep release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          retention-days: 1
          if-no-files-found: error
          path: |
            release-assets/cainary-${{ env.VERSION }}-macos-universal.zip
            release-assets/cainary-${{ env.VERSION }}-macos-universal.tar.gz

      # The macOS caveat, appended to the release notes by publish.
      - name: Keep the release note
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-macos
          retention-days: 1
          if-no-files-found: error
          path: release-assets/NOTES.md

      - name: Remove temporary keychain and certificate
        if: ${{ always() && env.SIGNING_CONFIGURED == 'true' }}
        run: |
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security delete-keychain "${RUNNER_TEMP}/build.keychain-db" || true

  # --- Linux ---------------------------------------------------------------------------------
  # The static musl CLI, once per architecture on a native runner; every Linux artifact ships it.
  build-linux-cli:
    name: Build Linux CLI (${{ matrix.arch }})
    needs: prepare
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      VERSION: ${{ needs.prepare.outputs.version }}
      # Read by the Makefile and packaging/linux.sh instead of asking git.
      CAINARY_GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
      CAINARY_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git make file

      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      # The bump is only committed by `publish`; every build applies the same one locally.
      - name: Apply the release version
        env:
          SET_VERSION_DATE: ${{ needs.prepare.outputs.release_date }}
          EXPECTED_HASH: ${{ needs.prepare.outputs.version_hash }}
        run: scripts/release-tree.sh "${VERSION}"

      - name: Install Rust (version from mise.toml, musl target)
        run: packaging/ci/linux-ci.sh deps rust

      - name: Build
        run: |
          set -eu
          make linux-cli LINUX_ARCH=${{ matrix.arch }}
          BIN="target/${{ matrix.arch }}-unknown-linux-musl/release/cainary"
          file "${BIN}"
          file "${BIN}" | grep -q static
          test "$("${BIN}" --version)" = "cainary ${VERSION}"

      - name: Keep the CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-cli-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: target/${{ matrix.arch }}-unknown-linux-musl/release/cainary

  # The tray app links the distro's Qt, so each format is built in its distro: the tarball and
  # .deb on Debian trixie, the .rpm on the oldest supported Fedora.
  build-linux:
    name: Build Linux ${{ matrix.formats }} (${{ matrix.arch }})
    needs: [prepare, build-linux-cli]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        family: [deb, rpm]
        include:
          - family: deb
            image: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
            formats: tar,deb
          - family: rpm
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            formats: rpm
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      VERSION: ${{ needs.prepare.outputs.version }}
      # Read by the Makefile and packaging/linux.sh instead of asking git.
      CAINARY_GIT_SHA: ${{ needs.prepare.outputs.git_sha }}
      CAINARY_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Install git
        run: |
          if command -v apt-get > /dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
          else dnf install -y -q git-core gawk; fi

      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      # The bump is only committed by `publish`; every build applies the same one locally.
      - name: Apply the release version
        env:
          SET_VERSION_DATE: ${{ needs.prepare.outputs.release_date }}
          EXPECTED_HASH: ${{ needs.prepare.outputs.version_hash }}
        run: scripts/release-tree.sh "${VERSION}"

      - name: Install Rust and the tray's build dependencies
        run: packaging/ci/linux-ci.sh deps build

      # Independent: cargo install builds in its own temporary target dir, so it doesn't
      # contend with the tray build for the linux/target lock.
      - parallel:
          - name: Install cargo-deb and cargo-generate-rpm
            run: packaging/ci/linux-ci.sh deps tools

          # The About window's commit and build date are compiled in from the job env.
          - name: Build the tray app
            run: cargo build --manifest-path linux/Cargo.toml --release --locked -p cainary-tray

      - name: Fetch the CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-cli-${{ matrix.arch }}
          path: cli

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
          FORMATS: ${{ matrix.formats }}
        run: |
          set -eu
          # Artifacts drop the executable bit.
          chmod 755 cli/cainary
          packaging/linux.sh --version "${VERSION}" --arch "${ARCH}" --cli cli/cainary \
            --tray linux/target/release/cainary-tray --formats "${FORMATS}" --out dist

      - name: Inspect the artifacts
        run: packaging/ci/linux-ci.sh inspect dist "${VERSION}" "${{ matrix.arch }}"

      - name: Keep the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.family }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Signs the .rpm files with the OpenPGP key pinned in packaging/signing/repo.asc, before they
  # are verified, hashed or published, so the release page and the DNF repository serve the same
  # signed files. Only committed scripts run here, never a build. Until the pin is committed the
  # packages pass through unsigned. The .deb files carry no signature of their own: APT checks
  # the repository's signed InRelease instead (the repo job).
  sign-linux:
    name: Sign Linux packages
    needs: [prepare, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    permissions:
      contents: read
    # The key lives only in this environment's secrets, limited to master like macos-signing;
    # see docs/distribution.md#linux-signing.
    environment: linux-signing
    steps:
      - name: Install git, rpm-sign and gnupg
        run: dnf install -y -q git-core rpm-sign gnupg2

      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      # One directory per artifact: dist/release-linux-rpm-<arch>/.
      - name: Fetch the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-rpm-*
          path: dist

      # The key is imported, used and removed in this one step; import fails closed against
      # the pin and sets LINUX_SIGNED.
      - name: Sign the packages
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -eu
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          packaging/ci/linux-signing.sh import
          if [ -f packaging/signing/repo.asc ]; then
            packaging/ci/linux-signing.sh sign-rpm dist/*/*.rpm
          fi

      - name: Replace the x86_64 packages with the signed ones
        if: ${{ env.LINUX_SIGNED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm-x86_64
          retention-days: 1
          if-no-files-found: error
          overwrite: true
          path: dist/release-linux-rpm-x86_64/*.rpm

      - name: Replace the aarch64 packages with the signed ones
        if: ${{ env.LINUX_SIGNED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm-aarch64
          retention-days: 1
          if-no-files-found: error
          overwrite: true
          path: dist/release-linux-rpm-aarch64/*.rpm

  # ci.yml's install smoke test, on the artifacts about to be published.
  verify-linux:
    name: Verify Linux ${{ matrix.kind }} (${{ matrix.name }})
    needs: [prepare, sign-linux]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-trixie, image: "debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308", kind: deb, family: deb, arch: x86_64 }
          - { name: ubuntu-26.04, image: "ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944", kind: deb, family: deb, arch: x86_64 }
          - { name: fedora-44, image: "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80", kind: rpm, family: rpm, arch: x86_64 }
          - { name: archlinux, image: "archlinux:latest@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0", kind: tar, family: deb, arch: x86_64 }
          - { name: debian-trixie-arm64, image: "debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308", kind: deb, family: deb, arch: aarch64 }
          - { name: fedora-44-aarch64, image: "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80", kind: rpm, family: rpm, arch: aarch64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false

      - name: Fetch the artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.family }}-${{ matrix.arch }}
          path: dist

      # As dnf checks it with gpgcheck=1, against the committed key rather than the one used.
      - name: Check the package signature
        if: ${{ matrix.kind == 'rpm' }}
        run: |
          if [ -f packaging/signing/repo.asc ]; then
            packaging/ci/linux-signing.sh check-rpm dist/*.rpm
          else
            echo "packaging/signing/repo.asc is not committed: the packages are unsigned"
          fi

      - name: Install and run
        run: packaging/ci/linux-ci.sh smoke ${{ matrix.kind }} dist

  # Every platform's assets are hashed and attested together, after they are all built and
  # the Linux ones verified, so SHA256SUMS has one writer and lists everything. It works only
  # on this run's artifacts; `publish` uploads the result. The attestation is public, though,
  # so this also waits for the quality gates.
  checksums:
    name: Checksums and provenance
    needs: [quality, quality-rust-linux, quality-linux, prepare, build, build-linux, sign-linux, verify-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            "cainary-${VERSION}-macos-universal.zip"
            "cainary-${VERSION}-macos-universal.tar.gz"
            "cainary-${VERSION}-linux-x86_64.tar.gz"
            "cainary-${VERSION}-linux-aarch64.tar.gz"
            "cainary_${VERSION}_amd64.deb"
            "cainary_${VERSION}_arm64.deb"
            "cainary-${VERSION}-1.x86_64.rpm"
            "cainary-${VERSION}-1.aarch64.rpm"
          )
          for f in "${expected[@]}"; do
            test -f "${f}" || { echo "::error::${f} is missing"; exit 1; }
            sha256sum "${f}" > "${f}.sha256"
          done
          if [ "$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -ne "${#expected[@]}" ]; then
            echo "::error::unexpected files in release-assets"
            ls -la
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.deb
            release-assets/*.rpm

      # `publish` merges these with the assets; the names must not match release-*.
      - name: Keep the checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          retention-days: 1
          if-no-files-found: error
          path: |
            release-assets/*.sha256
            release-assets/SHA256SUMS

  # The only job that changes the repository or the release page, and it runs only after every
  # build, the Linux verification and the checksums succeeded. It rebuilds nothing: it applies
  # the version bump to the base commit (checking it is the tree the builds used), commits it,
  # tags it and uploads the artifacts. The push is not forced, so it fails if master moved
  # since the base commit. After a failure past the tag, "Re-run failed jobs" (or the whole
  # run) finds the tag prepare saw and only completes the release.
  publish:
    name: Publish release
    needs: [quality, quality-rust-linux, quality-linux, prepare, build, build-linux, sign-linux, verify-linux, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      RESUMED: ${{ needs.prepare.outputs.resumed }}
    steps:
      # This job pushes the bump and the tag, so its checkout keeps the token (the only one).
      - name: Checkout the base commit
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the notes and changelog
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{prepared-notes,notes-macos}"
          path: notes

      - name: Fetch the assets and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release-*,checksums}"
          path: release-assets
          merge-multiple: true

      - name: Check the assets
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            "cainary-${VERSION}-macos-universal.zip"
            "cainary-${VERSION}-macos-universal.tar.gz"
            "cainary-${VERSION}-linux-x86_64.tar.gz"
            "cainary-${VERSION}-linux-aarch64.tar.gz"
            "cainary_${VERSION}_amd64.deb"
            "cainary_${VERSION}_arm64.deb"
            "cainary-${VERSION}-1.x86_64.rpm"
            "cainary-${VERSION}-1.aarch64.rpm"
          )
          want=("${expected[@]}" SHA256SUMS)
          for f in "${expected[@]}"; do want+=("${f}.sha256"); done
          have="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [ "${have}" != "$(printf '%s\n' "${want[@]}" | sort)" ]; then
            echo "::error::release-assets is not the expected file set"
            echo "${have}"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS

      - name: Apply the release version and check the tree
        env:
          SET_VERSION_DATE: ${{ needs.prepare.outputs.release_date }}
          EXPECTED_HASH: ${{ needs.prepare.outputs.version_hash }}
        run: scripts/release-tree.sh "${VERSION}"

      - name: Commit the bump and tag it
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}^{}" "refs/tags/${TAG_NAME}" | awk 'END { print $1 }')"
          if [ -n "${remote_tag}" ]; then
            # Only an earlier run of this workflow, from this same commit, may have made it.
            git fetch --no-tags origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
            if [ "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}^")" != "${BASE_SHA}" ]; then
              echo "::error::${TAG_NAME} exists but was not made from ${BASE_SHA}"
              exit 1
            fi
            echo "${TAG_NAME} already exists for ${BASE_SHA}: completing the release"
            exit 0
          fi
          cp notes/prepared-notes/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md Cargo.toml Cargo.lock linux/Cargo.toml linux/Cargo.lock \
            linux/data/ua.SkeLLLa.cAInary.metainfo.xml
          git commit -m "chore(release): ${TAG_NAME} [skip ci]"
          git tag "${TAG_NAME}"
          # No force: fails, and nothing is pushed, if master has moved past the base commit.
          git push --atomic origin HEAD:refs/heads/master "refs/tags/${TAG_NAME}"

      - name: Compose the release notes
        run: |
          set -euo pipefail
          cat notes/prepared-notes/NOTES.md notes/notes-macos/NOTES.md > release-assets-notes.md

      # Creates the release, or on a rerun updates its notes and replaces the assets. gh, not a
      # release action: the job already holds the token, and failglob fails on a missing file.
      - name: Create the release and upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s failglob
          assets=(
            "release-assets/cainary-${VERSION}-macos-universal.zip"
            "release-assets/cainary-${VERSION}-macos-universal.tar.gz"
            "release-assets/cainary-${VERSION}-linux-x86_64.tar.gz"
            "release-assets/cainary-${VERSION}-linux-aarch64.tar.gz"
            "release-assets/cainary_${VERSION}_amd64.deb"
            "release-assets/cainary_${VERSION}_arm64.deb"
            "release-assets/cainary-${VERSION}-1.x86_64.rpm"
            "release-assets/cainary-${VERSION}-1.aarch64.rpm"
            release-assets/*.sha256
            release-assets/SHA256SUMS
          )
          for asset in "${assets[@]}"; do
            test -f "${asset}" || { echo "::error::missing asset ${asset}"; exit 1; }
          done
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --title "${TAG_NAME}" --notes-file release-assets-notes.md
            gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${TAG_NAME}" "${assets[@]}" --verify-tag \
              --title "${TAG_NAME}" --notes-file release-assets-notes.md
          fi

  # The AUR package cainary-bin, from the published tarballs. On unless the repository variable
  # AUR_PUBLISH is "false"; skipped with a warning until the AUR_SSH_KEY secret (in the aur
  # environment) holds a key whose public half is on the maintainer's AUR account. The first push
  # creates the package.
  aur:
    name: Publish AUR package
    needs: [prepare, publish]
    if: ${{ needs.prepare.outputs.released == 'true' && vars.AUR_PUBLISH != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:latest@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    environment: aur
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      # aur.archlinux.org's published Ed25519 host key fingerprint (shown on its home page).
      AUR_HOST_KEY_SHA256: "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
    steps:
      - name: Check for the deploy key
        id: key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -n "${AUR_SSH_KEY}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::AUR_SSH_KEY is not set: the AUR package is not updated (docs/distribution.md#aur)"
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install tools
        if: ${{ steps.key.outputs.present == 'true' }}
        run: pacman -Syu --noconfirm --needed base-devel curl git openssh

      - name: Checkout release tag
        if: ${{ steps.key.outputs.present == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          persist-credentials: false

      # The checksums come from the artifacts this run built (the ones `checksums` published), not
      # from a file fetched over the network; `makepkg --verifysource` below then proves the
      # published tarballs match them.
      - name: Fetch the built tarballs
        if: ${{ steps.key.outputs.present == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-deb-*
          path: built
          merge-multiple: true

      - name: Render PKGBUILD and .SRCINFO
        if: ${{ steps.key.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          sum() {
            sha256sum "built/cainary-${VERSION}-linux-$1.tar.gz" | awk '{ print $1 }'
          }
          x86="$(sum x86_64)"
          arm="$(sum aarch64)"
          test "${#x86}" -eq 64 && test "${#arm}" -eq 64
          mkdir -p aur-out
          sed -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${x86}')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm}')/" \
            packaging/aur/PKGBUILD > aur-out/PKGBUILD
          grep -qx "pkgver=${VERSION}" aur-out/PKGBUILD
          grep -q "${x86}" aur-out/PKGBUILD && grep -q "${arm}" aur-out/PKGBUILD
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder aur-out
          su builder -c 'cd aur-out && makepkg --printsrcinfo > .SRCINFO && makepkg --verifysource'
          cat aur-out/PKGBUILD aur-out/.SRCINFO

      - name: Push to the AUR
        if: ${{ steps.key.outputs.present == 'true' }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="${RUNNER_TEMP}/aur-key"
          known="${RUNNER_TEMP}/aur-known-hosts"
          printf '%s\n' "${AUR_SSH_KEY}" > "${key}"
          trap 'rm -f "${key}"' EXIT
          # Pin the host key: accept the scanned key only if its fingerprint is AUR's.
          ssh-keyscan -t ed25519 aur.archlinux.org > "${known}"
          fp="$(ssh-keygen -lf "${known}" | awk '{ print $2 }')"
          if [ "${fp}" != "${AUR_HOST_KEY_SHA256}" ]; then
            echo "::error::aur.archlinux.org host key ${fp} is not ${AUR_HOST_KEY_SHA256}"
            exit 1
          fi
          # Explicit files: ssh reads ~/.ssh from the passwd entry, not from HOME.
          export GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o UserKnownHostsFile=${known} -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/cainary-bin.git "${RUNNER_TEMP}/aur"
          cp aur-out/PKGBUILD aur-out/.SRCINFO "${RUNNER_TEMP}/aur/"
          cd "${RUNNER_TEMP}/aur"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already has ${VERSION}"
          else
            git commit -m "Update to ${VERSION}"
            git push origin HEAD:master
          fi

  # APT and DNF repositories on GitHub Pages, deployed from this job (Pages source "GitHub
  # Actions"), the same layout as SkeLLLa/plasma-drop's: packaging/ci/pages-repo.sh builds them
  # from this run's verified .deb and .rpm files plus those of the 9 releases before it, since
  # each deploy replaces the site. Unsigned like plasma-drop's until packaging/signing/repo.asc
  # is committed; from then on the metadata and every .rpm are signed with that key, and the
  # release fails without it (docs/distribution.md#linux-signing). On unless the repository
  # variable PAGES_PUBLISH is "false". PAGES_BASE_URL overrides the URL for a custom domain.
  # This job holds the signing key and builds the site; `pages` only deploys it.
  repo:
    name: Build APT and DNF repositories
    needs: [prepare, publish]
    if: ${{ needs.prepare.outputs.released == 'true' && vars.PAGES_PUBLISH != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trixie's rpm (4.20, Sequoia) reads a pin with revoked subkeys; the runner's 4.18 can't.
    container: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    # In a container, run steps default to sh (dash); these use mapfile and ${var,,}.
    defaults:
      run:
        shell: bash
    environment: linux-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      # rpm for rpmsign and rpmkeys, which also sign the earlier releases' .rpm files.
      - name: Install git, gh, apt-ftparchive, createrepo_c and rpm
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git gh gnupg apt-utils createrepo-c rpm

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Fetch this release's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-*
          path: assets
          merge-multiple: true

      # The 9 releases before this one, as plasma-drop keeps them, so users can still pin or
      # downgrade. A release without Linux packages contributes nothing.
      - name: Fetch earlier releases' packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 30 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
              grep -vxF "${TAG_NAME}" | head -n 9 || true
          )
          for tag in "${tags[@]}"; do
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir assets --skip-existing \
              --pattern 'cainary_*_amd64.deb' --pattern 'cainary_*_arm64.deb' \
              --pattern 'cainary-*-1.x86_64.rpm' --pattern 'cainary-*-1.aarch64.rpm' ||
              echo "${tag}: no Linux packages"
          done
          ls -l assets

      # import fails closed against the pin, as in sign-linux, and sets LINUX_SIGNED.
      - name: Build the repositories
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          packaging/ci/linux-signing.sh import
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="${PAGES_BASE_URL:-https://${owner}.github.io/${GITHUB_REPOSITORY#*/}}"
          packaging/ci/pages-repo.sh assets site "${base}" "${VERSION}"

      - name: Verify the repositories
        run: |
          set -euo pipefail
          for f in deb/dists/stable/Release deb/cainary.list rpm/cainary.repo \
            rpm/x86_64/repodata/repomd.xml rpm/aarch64/repodata/repomd.xml \
            deb/dists/stable/main/binary-amd64/Packages.gz deb/dists/stable/main/binary-arm64/Packages.gz; do
            test -s "site/${f}"
          done
          for arch in amd64 arm64; do
            gzip -cd "site/deb/dists/stable/main/binary-${arch}/Packages.gz" |
              grep -x "Version: ${VERSION}" > /dev/null
          done
          if [ "${LINUX_SIGNED}" = "true" ]; then
            test -s site/deb/dists/stable/InRelease
            grep -qx gpgcheck=1 site/rpm/cainary.repo
            packaging/ci/linux-signing.sh check-rpm site/rpm/*/*.rpm
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Publish APT and DNF repositories (GitHub Pages)
    needs: repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # crates.io Trusted Publishing: a short-lived token from GitHub OIDC, no stored secret. On
  # unless the repository variable CRATES_IO_PUBLISH is "false". A crate that isn't on crates.io
  # yet is skipped with a warning: its first version is published by hand, then this workflow is
  # added as its trusted publisher (environment crates-io). After a partial upload, rerun the
  # workflow: the tag from the first attempt is detected and the missing crates are published.
  crates:
    name: Publish crates to crates.io
    needs: [prepare, publish]
    if: ${{ needs.prepare.outputs.released == 'true' && vars.CRATES_IO_PUBLISH != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust (version from mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal
          rustup default "${v}"

      # 200: this version is already published, so skip that crate; 404: publish it, unless the
      # crate itself is new (Trusted Publishing can't create a crate); anything else fails. A
      # rerun after a partial upload then publishes only what is missing.
      - name: Find crates not yet on crates.io
        id: missing
        run: |
          set -euo pipefail
          count=0
          exclude=""
          for crate in cainary-core cainary; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
              -A "cainary-release (https://github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            case "${code}" in
              200) echo "${crate} ${VERSION} is already on crates.io"; exclude="${exclude} --exclude ${crate}" ;;
              404)
                crate_code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
                  -A "cainary-release (https://github.com/${GITHUB_REPOSITORY})" \
                  "https://crates.io/api/v1/crates/${crate}")"
                case "${crate_code}" in
                  200) count=$((count + 1)) ;;
                  404)
                    echo "::warning::${crate} is not on crates.io yet: publish ${VERSION} by hand once (docs/distribution.md#cratesio)"
                    exclude="${exclude} --exclude ${crate}"
                    ;;
                  *) echo "::error::crates.io returned HTTP ${crate_code} for ${crate}"; exit 1 ;;
                esac
                ;;
              *) echo "::error::crates.io returned HTTP ${code} for ${crate} ${VERSION}"; exit 1 ;;
            esac
          done
          {
            echo "count=${count}"
            echo "exclude=${exclude}"
          } >> "${GITHUB_OUTPUT}"

      # Right before publishing: the token expires after 30 minutes.
      - name: Get a crates.io token (Trusted Publishing)
        if: ${{ steps.missing.outputs.count != '0' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: cargo publish
        if: ${{ steps.missing.outputs.count != '0' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXCLUDE: ${{ steps.missing.outputs.exclude }}
        run: |
          set -euo pipefail
          # EXCLUDE is "--exclude <crate>" pairs (or empty) and must split into words.
          # shellcheck disable=SC2086
          cargo publish --workspace --locked --registry crates-io ${EXCLUDE}

  packslip:
    name: Sign packslip manifest
    needs: [prepare, publish]
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signing never holds release-write access; publish-packslip uploads the bundle.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      # For packaging/packslip.toml.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag_name }}
          persist-credentials: false

      # The tag sits on the version-bump commit, not on github.sha (the push that triggered
      # this run), so record the commit the tag actually names.
      - name: Resolve tagged commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" --jq .sha)" >> "${GITHUB_OUTPUT}"

      # The manifest (packaging/packslip.toml) names the executables in each archive: the
      # macOS bundle's helper, and bin/cainary and bin/cainary-tray in the Linux tarballs. Its
      # paths are release-assets/<asset>, so the published assets are fetched there.
      - name: Fetch release tarballs and render the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets \
            --pattern "cainary-${VERSION}-macos-universal.tar.gz" \
            --pattern "cainary-${VERSION}-linux-x86_64.tar.gz" \
            --pattern "cainary-${VERSION}-linux-aarch64.tar.gz"
          test "$(find release-assets -name '*.tar.gz' | wc -l)" -eq 3
          sed "s/@VERSION@/${VERSION}/g" packaging/packslip.toml > "${RUNNER_TEMP}/packslip.toml"
          if grep -q '@VERSION@' "${RUNNER_TEMP}/packslip.toml"; then exit 1; fi

      - name: Sign packslip manifest
        id: packslip
        uses: jdx/packslip@ddcddd9c8c33977d2d08d5db91caec579da59aab # v1.11.0
        with:
          artifacts: release-assets/*.tar.gz
          manifest: ${{ runner.temp }}/packslip.toml
          tag: ${{ needs.prepare.outputs.tag_name }}
          version: ${{ needs.prepare.outputs.version }}
          commit: ${{ steps.source.outputs.commit }}
          attest: link
          upload: false

      - name: Keep signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip-bundle
          retention-days: 1
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Publish packslip manifest
    needs: [prepare, packslip]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch signed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip

      - name: Upload signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "${TAG_NAME}" packslip/packslip.sigstore.json --repo "${GITHUB_REPOSITORY}" --clobber

  verify-packslip:
    name: Verify published packslip manifest
    needs: [prepare, publish-packslip]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Signer fingerprint published in README.md; constant across releases. Set the
      # PACKSLIP_PIN repository variable from the first release's job summary.
      PACKSLIP_PIN: ${{ vars.PACKSLIP_PIN }}
    steps:
      - name: Install packslip
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: packslip@1.6.0

      # Check what users download: the public release URLs, not this run's local files.
      - name: Verify manifest against the published tarball
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          asset="cainary-${VERSION}-macos-universal.tar.gz"
          curl -fsSLO --retry 3 "${base}/${asset}"
          curl -fsSLO --retry 3 "${base}/packslip.sigstore.json"
          pin_args=()
          if [ -n "${PACKSLIP_PIN}" ]; then
            pin_args=(--pin "${PACKSLIP_PIN}")
          else
            echo "::warning::PACKSLIP_PIN is not set; verifying by identity only"
          fi
          packslip verify packslip.sigstore.json \
            --identity-prefix "https://github.com/${GITHUB_REPOSITORY}/" \
            --issuer https://token.actions.githubusercontent.com \
            "${pin_args[@]}" \
            --artifact "${asset}"
          {
            echo "### packslip signer fingerprint"
            echo
            echo "\`$(packslip pin packslip.sigstore.json)\`"
          } >> "${GITHUB_STEP_SUMMARY}"
