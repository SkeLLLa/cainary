[package]
name = "cainary-net"
description = "cAInary OTel debug collector: a loopback-only OTLP/JSON receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Until design §12 is answered; `cargo install cainary` stays network-free.
publish = false

[lib]
name = "cainary_net"
path = "src/lib.rs"

[[bin]]
name = "cainary-otel-debug"
path = "src/main.rs"

[dependencies]
cainary-core.workspace = true
cainary-sig.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
toml.workspace = true
regex.workspace = true
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[features]
default = []
# The endpoint takeover (`--tls`, design §16). Release builds enable it.
tls = ["dep:rustls", "dep:rcgen", "dep:time"]
